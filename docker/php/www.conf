; PHP-FPM pool for production (docker/php/Dockerfile copies it in after the default www.conf).
; Docker's default is pm.max_children = 5: the 6th simultaneous request waits. Tune with .env, no rebuild:
;   PHP_FPM_MAX_CHILDREN  ≈ (RAM you give PHP) / 60 MB.  4 GB server shared with MySQL: 10–15. 8 GB: 25–30.
[www]
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE}
; Recycle a worker after 500 requests (stops slow memory leaks).
pm.max_requests = 500

; Slow pages: any request over 10 s writes a stack trace to the container log
; (docker compose -f compose.prod.yaml logs app | grep -A20 "slow").
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2

; Hard stop for a stuck request (nginx gives up at 120 s too).
request_terminate_timeout = 130s

; Keep the environment (DB_*, REDIS_*…) for PHP.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
