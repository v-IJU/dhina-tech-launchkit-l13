# Production nginx (the "web" image). Differences from default.conf (local):
#  - serves public/ from the image, uploads from the shared storage volume
#  - proxies Reverb websockets (/app, /apps) so browsers use the same domain and port 443
#  - HTTPS is expected in front: AWS load balancer (ACM certificate), Cloudflare, or a host nginx/Caddy.
#    Laravel reads X-Forwarded-Proto from it (trustProxies in bootstrap/app.php).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 30M;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Hashed Vite assets never change: cache for a year.
    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Uploaded media (storage/app/public via the symlink).
    location /storage/ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Laravel Reverb websockets: wss://your-domain/app/... and /apps/... (REVERB_HOST=your-domain, REVERB_PORT=443)
    location ~ ^/apps?/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Load balancer health check: no access log noise.
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; try_files $uri /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Never serve dotfiles (.env, .git …)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
