# Local development stack (project ${COMPOSE_PROJECT_NAME:-laravel13}).
#   docker compose up -d                  start everything
#   docker compose --profile dev up -d    start everything + Vite dev server
#   docker compose down                   stop
#
# Website   http://localhost:8080
# Admin     http://localhost:8080/admin
# Mailpit   http://localhost:8025
# Horizon   http://localhost:8080/admin/horizon
# phpMyAdmin http://localhost:8082
#
# A second copy side by side (e.g. one SaaS, one single business): give it its own
# COMPOSE_PROJECT_NAME and ports in .env (APP_PORT, REVERB_PORT, FORWARD_DB_PORT,
# FORWARD_PMA_PORT, FORWARD_MAILPIT_PORT, VITE_PORT). This file stays the same.
#
# Only "app" builds the image; horizon/scheduler/reverb reuse it.
# No env_file: Laravel reads .env from the mounted project folder.

name: ${COMPOSE_PROJECT_NAME:-laravel13}

x-php: &php
  image: ${COMPOSE_PROJECT_NAME:-laravel13}-app:dev
  volumes:
    - .:/var/www/html
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *php
    container_name: ${COMPOSE_PROJECT_NAME:-laravel13}-app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}

  nginx:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-laravel13}-nginx
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  horizon:
    <<: *php
    container_name: ${COMPOSE_PROJECT_NAME:-laravel13}-horizon
    pull_policy: never
    depends_on:
      - app
    command: php artisan horizon

  scheduler:
    <<: *php
    container_name: ${COMPOSE_PROJECT_NAME:-laravel13}-scheduler
    pull_policy: never
    depends_on:
      - app
    command: php artisan schedule:work

  reverb:
    <<: *php
    container_name: ${COMPOSE_PROJECT_NAME:-laravel13}-reverb
    pull_policy: never
    depends_on:
      - app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${REVERB_PORT:-8081}:8080"

  node:
    image: node:22-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-laravel13}-node
    working_dir: /var/www/html
    environment:
      VITE_PORT: ${VITE_PORT:-5173}
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    volumes:
      - .:/var/www/html
    ports:
      - "${VITE_PORT:-5173}:5173"
    profiles: ["dev"]

  mysql:
    image: mysql:8.4
    container_name: ${COMPOSE_PROJECT_NAME:-laravel13}-mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-starter}
      MYSQL_USER: ${DB_USERNAME:-starter}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-laravel13}-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: ${COMPOSE_PROJECT_NAME:-laravel13}-mailpit
    ports:
      - "${FORWARD_MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

  # Database browser for local development: http://localhost:8082 (signed in as root, sees every database,
  # including the SaaS central and tenant_* ones). Not in compose.prod.yaml.
  phpmyadmin:
    image: phpmyadmin:5
    container_name: ${COMPOSE_PROJECT_NAME:-laravel13}-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      UPLOAD_LIMIT: 256M
    ports:
      - "${FORWARD_PMA_PORT:-8082}:80"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
